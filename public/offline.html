<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#075B4E">
  <title>Sem ligação · TALAZA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F7F8F5;color:#17352E;font-family:system-ui,-apple-system,sans-serif}
    main{width:100%;max-width:420px;padding:30px;border:1px solid #DCE6E0;border-radius:22px;background:#fff;text-align:center;box-shadow:0 12px 36px #1232}
    img{width:76px;height:76px}h1{margin:18px 0 8px;color:#075B4E}p{line-height:1.6;color:#5B6C65}
    button{margin-top:14px;border:0;border-radius:12px;padding:13px 22px;background:#075B4E;color:white;font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="/icons/talaza-icon.svg" alt="TALAZA">
    <h1>Estás sem ligação</h1>
    <p>A TALAZA precisa de internet para carregar a tua conta e as publicações. Verifica a ligação e tenta novamente.</p>
    <button type="button" onclick="window.location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
